<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu perfil | Urbaniza</title><link rel="stylesheet" href="Style_perfil.css"><link rel="stylesheet" href="App.css"><script src="App.js" defer></script></head>
<body><header><img src="assets/Logo.svg" alt="Urbaniza" class="logo"></header><main class="container"><h1>Meu perfil</h1><p id="status" role="status" aria-live="polite"></p>
<section class="painel"><h2 id="perfil-nome">Carregando…</h2><p id="perfil-email"></p><form id="perfil-form"><label>Nome<input name="nome" maxlength="100" autocomplete="name" required></label><label>Username<input name="username" pattern="[a-z0-9_]{3,30}" maxlength="30" required></label><label>Localidade<input name="localidade" maxlength="100" required></label><button type="submit" class="primario">Salvar perfil</button></form></section>
<section class="suporte"><h2>Minha conta</h2><a href="admin.html" id="admin-link" class="botao" hidden>Administrar usuários</a><button type="button" id="sair" class="btn btn-sair">Sair da conta</button><button type="button" id="abrir-exclusao" class="btn btn-excluir">Excluir conta</button></section>
<dialog id="modal-excluir" class="modal"><h2>Excluir conta?</h2><p>Suas avaliações e seus dados serão apagados. Esta ação não pode ser desfeita.</p><form id="excluir-conta-form"><label>Confirme sua senha<input type="password" name="senha" autocomplete="current-password" maxlength="72" required></label><div class="modal-acoes"><button type="button" id="cancelar-exclusao" class="btn btn-cancelar">Cancelar</button><button type="submit" class="btn btn-excluir">Sim, excluir</button></div></form></dialog></main><footer class="rodape-fixo"><nav class="menu-inferior" aria-label="Navegação principal"><a href="inicio.html" class="item-menu " ><img src="assets/inicio.svg" alt=""><span>Início</span></a><a href="mapa.html" class="item-menu " ><img src="assets/mapa.svg" alt=""><span>Mapa</span></a><a href="avaliacoes.html" class="item-menu " ><img src="assets/avaliacoes.svg" alt=""><span>Avaliações</span></a><a href="perfil.html" class="item-menu ativo" aria-current=page><img src="assets/perfil.svg" alt=""><span>Perfil</span></a></nav></footer></body></html>

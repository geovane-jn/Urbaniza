<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mapa das regiões | Urbaniza</title><link rel="stylesheet" href="Style_mapa.css"><link rel="stylesheet" href="App.css"><script src="App.js" defer></script><link rel="stylesheet" href="assets/leaflet/leaflet.css"><script src="assets/leaflet/leaflet.js" defer></script><script src="Script_mapa.js" defer></script></head>
<body><header><img src="assets/Logo.svg" alt="Urbaniza" class="logo"></header><main class="container"><h1>Explore São Paulo</h1><p>Notas calculadas a partir das avaliações da comunidade.</p><p id="status" role="status" aria-live="polite"></p><label class="barra-busca">Buscar região<input id="input-busca-regiao" type="search" placeholder="Nome do bairro" aria-label="Buscar região"></label><div class="filtros-categorias" aria-label="Filtrar nota por categoria"><button class="pilula-filtro selecionado" data-categoria="geral" aria-pressed="true">Geral</button><button class="pilula-filtro filtro-seguranca" data-categoria="seguranca" aria-pressed="false">Segurança</button><button class="pilula-filtro filtro-mobilidade" data-categoria="mobilidade" aria-pressed="false">Mobilidade</button><button class="pilula-filtro filtro-iluminacao" data-categoria="iluminacao" aria-pressed="false">Iluminação</button></div>
<div class="area-mapa-wrapper"><div id="mapa-sp" aria-label="Mapa dos bairros de São Paulo"></div><button type="button" id="btn-localizacao" class="btn-mapa-localizacao" aria-label="Minha localização" title="Minha localização">◎</button><div class="controles-zoom"><button type="button" id="btn-zoom-in" aria-label="Aproximar">+</button><button type="button" id="btn-zoom-out" aria-label="Afastar">−</button></div></div>
<section class="painel" id="detalhe-regiao" hidden><h2 id="nome-regiao"></h2><p id="zona-regiao"></p><p><strong id="nota-regiao"></strong> <span id="status-regiao" class="tag-status"></span></p><p id="total-avaliacoes"></p><a id="avaliar-regiao" class="botao" href="avaliacoes.html">Avaliar esta região</a></section><h2>Regiões disponíveis</h2><div id="lista-regioes" class="lista"></div></main><footer class="rodape-fixo"><nav class="menu-inferior" aria-label="Navegação principal"><a href="inicio.html" class="item-menu " ><img src="assets/inicio.svg" alt=""><span>Início</span></a><a href="mapa.html" class="item-menu ativo" aria-current=page><img src="assets/mapa.svg" alt=""><span>Mapa</span></a><a href="avaliacoes.html" class="item-menu " ><img src="assets/avaliacoes.svg" alt=""><span>Avaliações</span></a><a href="perfil.html" class="item-menu " ><img src="assets/perfil.svg" alt=""><span>Perfil</span></a></nav></footer></body></html>

<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Avaliações | Urbaniza</title><link rel="stylesheet" href="Style_inicio.css"><link rel="stylesheet" href="App.css"><script src="App.js" defer></script></head>
<body><header><img src="assets/Logo.svg" alt="Urbaniza" class="logo"></header><main class="container"><h1>Avaliações da comunidade</h1><p>Compartilhe sua experiência. Uma avaliação por região; você pode editá-la depois.</p><p id="status" role="status" aria-live="polite"></p>
<section class="painel"><h2 id="form-titulo">Fazer avaliação</h2><form id="avaliacao-form"><label>Pesquisar bairro<input type="search" id="busca-bairro-avaliacao" placeholder="Digite o nome do bairro" aria-label="Pesquisar bairro" autocomplete="off" aria-controls="regiao-avaliacao" aria-describedby="resultado-busca-bairro"></label><p id="resultado-busca-bairro" role="status" aria-live="polite"></p><label>Bairro<select name="regiaoId" id="regiao-avaliacao" required><option value="">Selecione</option></select></label><div class="notas-form"><label>Segurança<select name="seguranca" required><option value="">Nota</option><option value="1">1 — Muito ruim</option><option value="2">2 — Ruim</option><option value="3">3 — Regular</option><option value="4">4 — Boa</option><option value="5">5 — Muito boa</option></select></label><label>Mobilidade<select name="mobilidade" required><option value="">Nota</option><option value="1">1 — Muito ruim</option><option value="2">2 — Ruim</option><option value="3">3 — Regular</option><option value="4">4 — Boa</option><option value="5">5 — Muito boa</option></select></label><label>Iluminação<select name="iluminacao" required><option value="">Nota</option><option value="1">1 — Muito ruim</option><option value="2">2 — Ruim</option><option value="3">3 — Regular</option><option value="4">4 — Boa</option><option value="5">5 — Muito boa</option></select></label></div><label>Comentário (opcional)<textarea name="comentario" maxlength="1000" rows="3"></textarea></label><div class="acoes"><button type="submit" class="primario">Publicar avaliação</button><button type="button" id="cancelar-edicao" hidden>Cancelar edição</button></div></form></section>
<section><h2>Avaliações publicadas</h2><form id="filtro-avaliacoes" class="filtros"><label>Filtrar região<select name="regiaoId" id="filtro-regiao"><option value="">Todas as regiões</option></select></label><label class="checkbox"><input type="checkbox" name="minhas"> Somente minhas</label></form><div id="lista-avaliacoes" class="lista"></div></section></main><footer class="rodape-fixo"><nav class="menu-inferior" aria-label="Navegação principal"><a href="inicio.html" class="item-menu " ><img src="assets/inicio.svg" alt=""><span>Início</span></a><a href="mapa.html" class="item-menu " ><img src="assets/mapa.svg" alt=""><span>Mapa</span></a><a href="avaliacoes.html" class="item-menu ativo" aria-current=page><img src="assets/avaliacoes.svg" alt=""><span>Avaliações</span></a><a href="perfil.html" class="item-menu " ><img src="assets/perfil.svg" alt=""><span>Perfil</span></a></nav></footer></body></html>
